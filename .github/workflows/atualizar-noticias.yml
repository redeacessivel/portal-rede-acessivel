name: Atualizar notícias oficiais

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o portal
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Consultar apenas fontes oficiais
        run: python scripts/atualizar_noticias.py

      - name: Publicar apenas quando existirem alterações
        run: |
          if git diff --quiet -- dados/noticias.json; then
            echo "Não existem notícias novas."
            exit 0
          fi
          git config user.name "Rede Acessível - atualização automática"
          git config user.email "actions@users.noreply.github.com"
          git add dados/noticias.json
          git commit -m "Atualizar notícias oficiais"
          git push
